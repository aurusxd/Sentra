services:
  backend:
    build: .
    container_name: sentra-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentra
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  migrations:
    build: .
    command: "uv run alembic upgrade head"

    depends_on:
      - db


volumes:
  postgres_data: